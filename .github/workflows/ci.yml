name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verifica JSONs de dados
        run: |
          for f in mensal anual receitas despesas poderes orgaos_todos; do
            test -s public/data/$f.json || (echo "faltando public/data/$f.json" && exit 1)
            python3 -c "import json; json.load(open('public/data/$f.json')); print('ok $f')"
          done
